name: Generate PlantUML Diagrams

'on':
push:
branches:
- main
paths:
- '**/*.puml'

workflow_dispatch:

permissions:
contents: write

jobs:
generate-diagrams:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Install PlantUML
    run: |
      sudo apt-get update
      sudo apt-get install -y plantuml

  - name: Find PlantUML files
    run: |
      echo "=== PlantUML files ==="
      find . -type f -name "*.puml" -print

  - name: Generate PNG diagrams
    run: |
      find . -type f -name "*.puml" -print0 | while IFS= read -r -d '' file; do
        echo "Generating: $file"
        plantuml -tpng "$file"
      done

  - name: Check generated PNG files
    run: |
      echo "=== Generated PNG files ==="
      find . -type f -name "*.png" -print

  - name: Commit and push diagrams
    run: |
      git config --local user.name "github-actions[bot]"
      git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add -A

      if git diff --cached --quiet; then
        echo "No diagram changes to commit."
        exit 0
      fi

      git commit -m "docs: update PlantUML diagrams"
      git push
